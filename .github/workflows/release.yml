name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            ccache:p
            pkgconf:p
            python:p
            sdl3:p
            pango:p
            zlib:p
            libjpeg-turbo:p
            libpng:p
            ffmpeg:p
            libvorbis:p
            vulkan-headers:p
            vulkan-loader:p
      - name: Resolve release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Compute ccache cache epoch (UTC day)
        run: echo "DATE_EPOCH=$(date -u -d 'today 00:00' +%s)" >> "$GITHUB_ENV"
      - name: Restore ccache cache
        uses: actions/cache/restore@v4
        with:
          path: D:\a\_temp\ss2-ccache
          key: ccache-win64-ucrt64-${{ env.DATE_EPOCH }}
          restore-keys: |
            ccache-win64-ucrt64-
      - name: Configure & build Release
        env:
          CCACHE_DIR: /d/a/_temp/ss2-ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Package portable Windows bundle
        run: |
          PKG="ss2-${RELEASE_TAG}-windows-x86_64"
          rm -rf stage dist && mkdir -p "stage/$PKG" dist
          cmake --install build --prefix "stage/$PKG"
          cp /ucrt64/bin/libvorbisfile-3.dll "stage/$PKG/"
          for round in 1 2 3; do
            for bin in "stage/$PKG"/*.exe "stage/$PKG"/*.dll; do
              ldd "$bin" | awk '/\/ucrt64\/bin\// {print $3}' | while read -r dll; do
                cp -n "$dll" "stage/$PKG/"
              done
            done
          done
          ls -lh "stage/$PKG"
      - name: Verify standalone launch & archive zip
        shell: pwsh
        run: |
          $pkg = "ss2-$($env:RELEASE_TAG)-windows-x86_64"
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & ".\stage\$pkg\ss2.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path ".\stage\$pkg" -DestinationPath ".\dist\$pkg.zip" -Force
          Get-Item ".\dist\$pkg.zip" | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/*.zip
          retention-days: 14

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            icd: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            icd: aarch64
    runs-on: ${{ matrix.runner }}
    container: fedora:45
    timeout-minutes: 30
    steps:
      - run: dnf install -y git gcc-c++ zlib-ng-compat-devel libjpeg-turbo-devel libpng-devel python3 clang compiler-rt cmake ninja-build ccache SDL3-devel pango-devel fontconfig google-noto-sans-fonts ffmpeg-free-devel vulkan-headers vulkan-loader-devel mesa-vulkan-drivers vulkan-validation-layers tar gzip
      - uses: actions/checkout@v4
      - name: Resolve release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Compute ccache cache epoch (UTC day)
        run: echo "DATE_EPOCH=$(date -u -d 'today 00:00' +%s)" >> "$GITHUB_ENV"
      - name: Restore ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.icd }}-g++-Release-${{ env.DATE_EPOCH }}
          restore-keys: |
            ccache-${{ matrix.icd }}-g++-Release-
      - name: Configure & build Release
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DSS2_TEST_WINDOW=ON -DSS2_TEST_VALIDATION=ON &&
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.${{ matrix.icd }}.json
      - name: Package Linux tarball
        run: |
          PKG="ss2-${RELEASE_TAG}-linux-${{ matrix.arch }}"
          rm -rf stage dist && mkdir -p "stage/$PKG" dist
          cmake --install build --prefix "stage/$PKG"
          cp README.md "stage/$PKG/"
          tar -C stage -czf "dist/$PKG.tar.gz" "$PKG"
          ls -lh "dist/$PKG.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 14

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate checksums & publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          (cd assets && sha256sum *.zip *.tar.gz > SHA256SUMS.txt)
          ls -lh assets
          cat assets/SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          ## Sudden Strike II Native Engine

          Native SDL3 + Vulkan 1.3 reimplementation of *Sudden Strike II (Gold 2.2)* for **Windows x86-64** and **Linux (x86-64 & ARM64)**.

          > **Note:** Original or GOG *Sudden Strike II (Gold 2.2)* game data is required and not included.

          ### Highlights
          - **Full Retail Parity**: All 136 `.ssc`/`.ssm`/`.smm` missions (`0` unhandled CAOF opcodes), bit-identical visibility/combat/AI, progressive `dom.res` building & `MOST.RES` bridge destruction, Gold 2.2 front end, animated `I-BRF` briefings & voices, looping menu/in-game music, and persistent `SS2SAVE2` save/load.
          - **2–4 Player Lockstep Multiplayer**: Cross-architecture deterministic TCP Star Host-Relay (`x86_64`, `x86-64-v3`, `ARM64` GCC/Clang).
          - **Out-of-the-Box Mods**: `sudtest.ini` `[Data]`/`[Game]` VFS chains, unpacked/gzip folders (`mycommon\`), `Scheme1..N` (`Scheme3` `desc_scheme3.sue`/`lang_desc_scheme3.sue`), `addons/*.ssx`, `mods/`/`Run/` discovery, `--mod`/`--list-mods`, and live `Options -> Mod` switching.

          ### Quick Start
          - **Windows**: Extract `ss2-*-windows-x86_64.zip` and either copy its contents (`ss2.exe` + bundled DLLs) into your *Sudden Strike II* folder or run `ss2.exe --game-dir "C:\path\to\Sudden Strike 2"`.
          - **Linux**: Extract `ss2-*-linux-*.tar.gz` (contains `bin/ss2`, `.desktop`, icon, and AppStream metadata; requires SDL3, PangoCairo, zlib, libjpeg-turbo, libpng, libvorbis, FFmpeg, and Vulkan loader) and run `./bin/ss2 --game-dir /path/to/game` (or place game files in `~/.local/share/ss2/game`).
          EOF
          gh release create "$TAG" assets/* \
            --title "Sudden Strike II Native Engine $TAG" \
            --notes-file release-notes.md \
            --verify-tag || gh release upload "$TAG" assets/* --clobber
