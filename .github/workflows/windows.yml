name: Windows x86-64
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            cmake:p
            ninja:p
            ccache:p
            pkgconf:p
            python:p
            sdl3:p
            pango:p
            zlib:p
            libjpeg-turbo:p
            libpng:p
            ffmpeg:p
            libvorbis:p
            vulkan-headers:p
            vulkan-loader:p
            mesa:p
            vulkan-validation-layers:p
      - name: Compute ccache cache epoch (UTC day)
        run: echo "DATE_EPOCH=$(date -u -d 'today 00:00' +%s)" >> "$GITHUB_ENV"
      - name: Restore ccache cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: D:\a\_temp\ss2-ccache
          key: ccache-win64-ucrt64-${{ env.DATE_EPOCH }}
          restore-keys: |
            ccache-win64-ucrt64-
      - name: Configure
        env:
          CCACHE_DIR: /d/a/_temp/ss2-ccache
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSS2_TEST_WINDOW=ON \
            -DSS2_TEST_VALIDATION=ON
      - name: Build
        env:
          CCACHE_DIR: /d/a/_temp/ss2-ccache
        run: cmake --build build -j"$(nproc)"
      - name: Save ccache cache
        if: always() && env.DATE_EPOCH != '' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\a\_temp\ss2-ccache
          key: ccache-win64-ucrt64-${{ env.DATE_EPOCH }}
      - name: Test
        run: |
          export SDL_VIDEO_DRIVER=windows
          export SDL_AUDIODRIVER=dummy
          export VK_DRIVER_FILES="$(cygpath -w /ucrt64/share/vulkan/icd.d/lvp_icd.x86_64.json)"
          export VK_ADD_LAYER_PATH="$(cygpath -w /ucrt64/share/vulkan/explicit_layer.d)"
          ctest --test-dir build --output-on-failure --no-tests=error 2>&1 | tee ctest.log
      - name: Package portable Windows bundle
        run: |
          rm -rf dist/ss2-windows-x86_64
          cmake --install build --prefix dist/ss2-windows-x86_64
          cp /ucrt64/bin/libvorbisfile-3.dll /ucrt64/bin/vulkan-1.dll dist/ss2-windows-x86_64/
          for round in 1 2 3; do
            for bin in dist/ss2-windows-x86_64/*.exe dist/ss2-windows-x86_64/*.dll; do
              ldd "$bin" | awk '/\/ucrt64\/bin\// {print $3}' | while read -r dll; do
                cp -n "$dll" dist/ss2-windows-x86_64/
              done
            done
          done
          ls -lh dist/ss2-windows-x86_64
      - name: Verify standalone launch on clean Windows PATH
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          if (-not (Test-Path ".\dist\ss2-windows-x86_64\vulkan-1.dll")) { throw "Missing vulkan-1.dll" }
          .\dist\ss2-windows-x86_64\ss2.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ss2-windows-x86_64
          path: dist/ss2-windows-x86_64
          retention-days: 14
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-windows-x86_64
          path: |
            ctest.log
            build/CMakeCache.txt
          retention-days: 7
          if-no-files-found: ignore
