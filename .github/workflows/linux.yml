name: Linux Vulkan
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    container: fedora:45
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            icd_arch: x86_64
            type: Release
            compiler: g++
            flags: ""
          - runner: ubuntu-24.04
            icd_arch: x86_64
            type: Debug
            compiler: clang++
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - runner: ubuntu-24.04-arm
            icd_arch: aarch64
            type: Release
            compiler: g++
            flags: ""
          - runner: ubuntu-24.04-arm
            icd_arch: aarch64
            type: Debug
            compiler: clang++
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
    steps:
      - run: dnf install -y git gcc-c++ zlib-ng-compat-devel libjpeg-turbo-devel libpng-devel python3 clang compiler-rt cmake ninja-build ccache SDL3-devel pango-devel fontconfig google-noto-sans-fonts ffmpeg-free-devel vulkan-headers vulkan-loader-devel mesa-vulkan-drivers vulkan-validation-layers
      - uses: actions/checkout@v4
      - name: Compute ccache cache epoch (UTC day)
        run: echo "DATE_EPOCH=$(date -u -d 'today 00:00' +%s)" >> "$GITHUB_ENV"
      - name: Restore ccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.icd_arch }}-${{ matrix.compiler }}-${{ matrix.type }}-${{ env.DATE_EPOCH }}
          restore-keys: |
            ccache-${{ matrix.icd_arch }}-${{ matrix.compiler }}-${{ matrix.type }}-
            ccache-${{ matrix.icd_arch }}-${{ matrix.compiler }}-${{ matrix.type }}
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          -DSS2_TEST_WINDOW=ON -DSS2_TEST_VALIDATION=ON
      - run: cmake --build build
      - name: Save ccache cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.icd_arch }}-${{ matrix.compiler }}-${{ matrix.type }}-${{ env.DATE_EPOCH }}
      - name: ctest
        run: ctest --test-dir build --output-on-failure --no-tests=error 2>&1 | tee ctest.log
        shell: bash
        env:
          SDL_VIDEO_DRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.${{ matrix.icd_arch }}.json
          UBSAN_OPTIONS: halt_on_error=1
      - name: Install desktop & packaging smoke check
        run: >
          cmake --install build --prefix dist/ss2-linux-${{ matrix.icd_arch }}
          && test -x dist/ss2-linux-${{ matrix.icd_arch }}/bin/ss2
          && test -f dist/ss2-linux-${{ matrix.icd_arch }}/share/applications/io.github.biosed.ss2.desktop
          && test -f dist/ss2-linux-${{ matrix.icd_arch }}/share/icons/hicolor/scalable/apps/io.github.biosed.ss2.svg
          && test -f dist/ss2-linux-${{ matrix.icd_arch }}/share/metainfo/io.github.biosed.ss2.metainfo.xml
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ matrix.icd_arch }}-${{ matrix.compiler }}-${{ matrix.type }}
          path: |
            ctest.log
            build
          retention-days: 7
          if-no-files-found: ignore

  cross-isa-determinism:
    runs-on: ubuntu-24.04
    container: fedora:45
    timeout-minutes: 15
    steps:
      - run: dnf install -y gcc-c++ clang zig qemu-user-static-aarch64 qemu-user-static-x86
      - uses: actions/checkout@v4
      - run: ./tools/check-cross-isa-sim.sh
